<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'self' data: gap: content: blob: mediastream:; style-src * 'self' 'unsafe-inline' https:; script-src * 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; img-src * 'self' data: blob: content: https:; media-src * 'self' data: blob: content: mediastream: https:; font-src * 'self' https: data:; connect-src * 'self' https: wss: blob: data:; frame-src * 'self' https: blob: data:;">
    <title>Orlixa</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="cordova.js"></script>
    <script src="js/config.js"></script>
</head>
<body>
    <div id="loading-screen" class="screen-overlay">
        <div class="spinner"></div>
        <p class="loading-text">Loading Orlixa...</p>
    </div>

    <div id="error-screen" class="screen-overlay hidden">
        <div class="error-content">
            <div class="error-icon">⚡</div>
            <h2>Connection Error</h2>
            <p id="error-msg">Unable to connect to Orlixa. Please check your internet connection.</p>
            <button id="retry-btn">Retry</button>
        </div>
    </div>

    <iframe
        id="web-frame"
        src="about:blank"
        allow="camera *; microphone *; geolocation *; autoplay *; clipboard-read *; clipboard-write *; display-capture *; fullscreen *"
        allowfullscreen>
    </iframe>

    <script src="js/app.js"></script>
</body>
</html>
  <!--
    CSP allows the remote origin the app wraps. Add any additional domains
    (API/CDN/auth providers) the site loads to connect-src / frame-src / img-src as needed.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: content: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-src https://orlixa.art; connect-src https://orlixa.art; img-src 'self' https://orlixa.art data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#0b0b14">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <title>Orlixa</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">

    <!-- Splash / loading state, shown until the remote page fires 'load' -->
    <div id="loading-screen">
      <div class="loading-inner">
        <div class="logo-badge">O</div>
        <div class="app-name">Orlixa</div>
        <div class="spinner"></div>
      </div>
    </div>

    <!-- Offline / load-error state -->
    <div id="error-screen" class="hidden">
      <div class="error-inner">
        <div class="error-icon">⚠</div>
        <h1>Can't reach Orlixa</h1>
        <p>Check your internet connection and try again.</p>
        <button id="retry-btn">Retry</button>
      </div>
    </div>

    <!-- The actual site, wrapped in an iframe so we keep native chrome (splash, offline page, back button) around it -->
    <iframe id="web-frame" src="about:blank" allow="camera; microphone; geolocation; autoplay; clipboard-read; clipboard-write"></iframe>

  </div>

  <script src="cordova.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
